<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#244b38">
<title>Jeu de Berger — V0.3.1</title>
<link rel="stylesheet" href="style.css?v=0.3.1">
<script src="game.js?v=0.3.1" defer></script>
</head>
<body>
<section id="home" class="screen" aria-labelledby="home-title">
  <div class="home-art" aria-hidden="true"><span class="wool one"></span><span class="wool two"></span><span class="wool three"></span><span class="little-dog"></span></div>
  <p class="eyebrow">UN CHIEN, UN TROUPEAU, VOUS.</p>
  <h1 id="home-title">Jeu de Berger</h1>
  <p class="intro">Rassemblez vos moutons<br>et guidez-les jusqu’à l’enclos.</p>
  <button id="play" class="primary">JOUER</button>
  <p class="version">Prototype V0.3.1</p>
</section>
<section id="game" hidden>
  <header>
    <div class="heading"><p class="brand">Jeu de Berger <span>V0.3.1</span></p><button id="restart" class="secondary">Recommencer</button></div>
    <h2 id="level-title"></h2>
    <p id="objective" aria-live="polite"></p>
  </header>
  <main id="stage"><canvas id="field" tabindex="0" aria-label="Terrain de jeu. Touchez pour envoyer le chien, maintenez et glissez pour le guider.">Ce jeu nécessite Canvas 2D et JavaScript.</canvas></main>
  <footer>Touchez pour envoyer le chien. Glissez pour le guider.</footer>
</section>
<section id="victory" class="screen overlay" role="dialog" aria-modal="true" aria-labelledby="victory-title" hidden>
  <div class="victory-card">
    <div class="success-mark" aria-hidden="true">✓</div>
    <h2 id="victory-title"></h2>
    <p>Tout le troupeau est dans l’enclos.</p>
    <button id="next" class="primary">NIVEAU SUIVANT</button>
    <button id="home-button" class="primary" hidden>RETOUR À L’ACCUEIL</button>
  </div>
</section>
<noscript>Activez JavaScript dans votre navigateur pour jouer.</noscript>
</body>
</html>
